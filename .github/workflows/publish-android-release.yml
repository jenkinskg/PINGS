name: Publish Android Release
on:
  push:
    paths:
      - '.github/workflows/publish-android-release.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Pings-Android-v0.14.apk
      - name: Publish APK to v0.14
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.14
          name: PINGS v0.14
          files: Pings-Android-v0.14.apk
