name: Build Simple PDF Reader APK
on:
  push:
    branches: [main]
    paths: ['SimplePdfReader/**', '.github/workflows/simple-pdf-reader.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build APK
        run: gradle -p SimplePdfReader assembleDebug --no-daemon
      - name: Prepare download
        run: cp SimplePdfReader/app/build/outputs/apk/debug/app-debug.apk Simple-PDF-Reader-v1.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Simple-PDF-Reader-APK
          path: Simple-PDF-Reader-v1.0.apk
      - name: Publish APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view simple-pdf-v1.0 >/dev/null 2>&1 || gh release create simple-pdf-v1.0 --title "Simple PDF Reader 1.0" --notes "Free Android PDF reader. Pinch zoom, zoom buttons, filename tabs, offline. No ads, login, trial, or subscription. First build; physical-device testing pending."
          gh release upload simple-pdf-v1.0 Simple-PDF-Reader-v1.0.apk --clobber
