name: Publish Windows Release
on:
  push:
    paths:
      - '.github/workflows/publish-windows-release.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build Pings.exe
        run: dotnet publish Pings.Windows/Pings.Windows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.11
          name: PINGS v0.11
          body: Windows PINGS Network Availability Monitor v0.11
          files: Pings.Windows/bin/Release/net8.0-windows/win-x64/publish/Pings.exe
